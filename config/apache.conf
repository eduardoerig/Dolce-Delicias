<VirtualHost *:80>
 DocumentRoot /var/www/html/public
 <Directory /var/www/html/public>
  Options -Indexes
  AllowOverride None
  Require all granted
  RewriteEngine On
  RewriteCond %{REQUEST_FILENAME} !-f
  RewriteRule ^ index.php [QSA,L]
 </Directory>
 # CSS/JS/imagens mudam a cada atualização do site: o navegador guarda, mas
 # confere com o servidor (ETag) antes de usar. Sem mudança, a resposta é um 304 vazio.
 <Directory /var/www/html/public/assets>
  Header set Cache-Control "no-cache"
 </Directory>
</VirtualHost>
