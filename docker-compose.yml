services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads:/var/www/html/storage/uploads
      - logs:/var/www/html/storage/logs
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-dolce}
      POSTGRES_USER: ${DB_USERNAME:-dolce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Preencha DB_PASSWORD no .env}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres:
  uploads:
  logs:
